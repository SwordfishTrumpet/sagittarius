name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Guard — AGENTS.md / TODO.md must never be committed
        run: |
          LEAKED=$(git ls-files | grep -E '^(AGENTS|TODO)\.md$' || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::AGENTS.md and TODO.md are gitignored local-only working docs and must NEVER be committed or pushed."
            echo "Found tracked: $LEAKED"
            exit 1
          fi
          echo "✓ AGENTS.md / TODO.md not tracked"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm test

      - name: Run test suite again (stress pass — catches integration flakes)
        run: npm test

      - name: Build production bundle
        run: npm run build
